<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">冒險者徽章製作流程</title>
  <desc id="desc">冒險者徽章從區域小王取得材料，前往奇岩製作 NPC 升級到五階。</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#5d421f"/>
      <stop offset=".48" stop-color="#11131c"/>
      <stop offset="1" stop-color="#07080d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0ac"/>
      <stop offset=".52" stop-color="#d4a04a"/>
      <stop offset="1" stop-color="#7f511d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity=".18" stroke="#d4a04a" fill="none">
    <circle cx="600" cy="336" r="260"/>
    <circle cx="600" cy="336" r="330"/>
    <path d="M120 160 H1080 M120 515 H1080"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M600 128 L703 188 L703 306 L600 366 L497 306 L497 188 Z" fill="#151824" stroke="url(#gold)" stroke-width="8"/>
    <path d="M600 166 L669 206 L669 286 L600 326 L531 286 L531 206 Z" fill="rgba(212,160,74,.18)" stroke="#f7dc91" stroke-width="4"/>
    <text x="600" y="260" text-anchor="middle" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="84" font-weight="900" fill="#f7dc91">V</text>
  </g>
  <g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" text-anchor="middle">
    <text x="600" y="78" font-size="44" font-weight="900" fill="#f7dc91">冒險者徽章製作</text>
    <text x="600" y="116" font-size="22" fill="#d8c396">打區域小王取得材料，逐階升級 I～V</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="90" y="415" width="245" height="122" rx="18" fill="#11131c" stroke="#8c6a31"/>
    <rect x="370" y="415" width="210" height="122" rx="18" fill="#11131c" stroke="#8c6a31"/>
    <rect x="620" y="415" width="210" height="122" rx="18" fill="#11131c" stroke="#8c6a31"/>
    <rect x="865" y="415" width="245" height="122" rx="18" fill="#11131c" stroke="#8c6a31"/>
    <path d="M335 476 H370 M580 476 H620 M830 476 H865" stroke="#f7dc91" stroke-width="6" stroke-linecap="round"/>
    <path d="M360 476 l-16 -12 v24 z M610 476 l-16 -12 v24 z M855 476 l-16 -12 v24 z" fill="#f7dc91"/>
  </g>
  <g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
    <text x="212" y="456" text-anchor="middle" font-size="24" font-weight="900" fill="#f7dc91">區域小王</text>
    <text x="212" y="493" text-anchor="middle" font-size="18" fill="#c7bca4">冒險徽章、魔物殘魂</text>
    <text x="475" y="456" text-anchor="middle" font-size="24" font-weight="900" fill="#f7dc91">奇岩 NPC</text>
    <text x="475" y="493" text-anchor="middle" font-size="18" fill="#c7bca4">冒險者徽章製作</text>
    <text x="725" y="456" text-anchor="middle" font-size="24" font-weight="900" fill="#f7dc91">逐階升級</text>
    <text x="725" y="493" text-anchor="middle" font-size="18" fill="#c7bca4">I → II → III → IV → V</text>
    <text x="988" y="456" text-anchor="middle" font-size="24" font-weight="900" fill="#f7dc91">角色成長</text>
    <text x="988" y="493" text-anchor="middle" font-size="18" fill="#c7bca4">長期收集，穩定提升</text>
  </g>
</svg>
