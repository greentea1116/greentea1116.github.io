<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">每日狩獵王玩法流程</title><desc id="desc">每日從怪物池抽選目標，玩家擊殺累積個人名次，第一名獲得狩獵王祝福。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171717"/><stop offset="1" stop-color="#282115"/></linearGradient><linearGradient id="gold" x2="0" y2="1"><stop stop-color="#f4dc9e"/><stop offset="1" stop-color="#a97b30"/></linearGradient></defs>
<rect width="1200" height="620" rx="10" fill="url(#bg)"/><path d="M40 95H1160M40 540H1160" stroke="#5a4927" stroke-width="2"/>
<text x="64" y="62" fill="#e7c879" font-family="sans-serif" font-size="20" font-weight="700">DAILY HUNT · 每日狩獵王</text>
<g font-family="sans-serif">
<g transform="translate(70 145)"><rect width="300" height="320" rx="8" fill="#1c1b19" stroke="#786038" stroke-width="2"/><circle cx="150" cy="92" r="54" fill="#322919" stroke="#bb9650" stroke-width="3"/><path d="M119 73h62l-8 54-23 20-23-20z" fill="url(#gold)"/><path d="M119 83h-20q0 38 37 42M181 83h20q0 38-37 42M150 147v28m-25 0h50" fill="none" stroke="#e9d18e" stroke-width="8" stroke-linecap="round"/><text x="150" y="225" text-anchor="middle" fill="#f4dc9e" font-size="24" font-weight="700">每日抽選目標</text><text x="150" y="265" text-anchor="middle" fill="#c8c0b1" font-size="16">依當日怪物池出題</text><text x="150" y="291" text-anchor="middle" fill="#c8c0b1" font-size="16">今日目標用指令查詢</text></g>
<path d="M392 302h60" stroke="#d1ae61" stroke-width="4"/><path d="m442 292 16 10-16 10" fill="none" stroke="#d1ae61" stroke-width="4"/>
<g transform="translate(450 145)"><rect width="300" height="320" rx="8" fill="#1c1b19" stroke="#786038" stroke-width="2"/><circle cx="150" cy="92" r="54" fill="#322919" stroke="#bb9650" stroke-width="3"/><path d="M112 109l26-31 22 18 31-36 9 10-39 48-23-17-18 22z" fill="url(#gold)"/><path d="M118 127h64" stroke="#e9d18e" stroke-width="6"/><text x="150" y="225" text-anchor="middle" fill="#f4dc9e" font-size="24" font-weight="700">擊殺累積積分</text><text x="150" y="265" text-anchor="middle" fill="#c8c0b1" font-size="16">有效擊殺每隻 1 點</text><text x="150" y="291" text-anchor="middle" fill="#c8c0b1" font-size="16">本人擊殺數即時可查</text></g>
<path d="M772 302h60" stroke="#d1ae61" stroke-width="4"/><path d="m822 292 16 10-16 10" fill="none" stroke="#d1ae61" stroke-width="4"/>
<g transform="translate(830 145)"><rect width="300" height="320" rx="8" fill="#1c1b19" stroke="#786038" stroke-width="2"/><circle cx="150" cy="92" r="54" fill="#322919" stroke="#bb9650" stroke-width="3"/><path d="M116 65h68v52q0 33-34 44-34-11-34-44z" fill="url(#gold)"/><path d="M132 96l13 13 27-31" fill="none" stroke="#342719" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="225" text-anchor="middle" fill="#f4dc9e" font-size="24" font-weight="700">爭奪每日第一</text><text x="150" y="265" text-anchor="middle" fill="#c8c0b1" font-size="16">榜單約每 5 分鐘更新</text><text x="150" y="291" text-anchor="middle" fill="#c8c0b1" font-size="16">結算冠軍獲 12 小時祝福</text></g>
<text x="600" y="590" text-anchor="middle" fill="#9f957f" font-size="14">流程示意圖 · 獎勵與活動設定以遊戲伺服器為準</text></g></svg>