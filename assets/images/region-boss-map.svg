<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">區域王查詢示意圖</title><desc id="desc">區域王位置查詢用的黑金奇幻地圖視覺</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090a0e"/><stop offset=".55" stop-color="#17100d"/><stop offset="1" stop-color="#261607"/></linearGradient><radialGradient id="mark"><stop offset="0" stop-color="#fff0a8"/><stop offset=".55" stop-color="#d89b37"/><stop offset="1" stop-color="#7a351c"/></radialGradient><style>text{font-family:'Microsoft JhengHei','Noto Sans TC',Arial,sans-serif}.t{font-size:46px;font-weight:900;fill:#ffe5a0}.s{font-size:22px;fill:#c9b98f}.m{font-size:22px;font-weight:900;fill:#ffe5a0}.p{font-size:18px;fill:#cbb98e}</style></defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/><rect x="30" y="30" width="1140" height="700" rx="24" fill="none" stroke="#c89436" stroke-width="3" opacity=".75"/>
