<g transform="translate(92 610)"><rect width="1016" height="72" rx="16" fill="#120f12" stroke="#5d4420"/><text x="508" y="45" text-anchor="middle" class="s">圖片為查詢示意，不冒充遊戲截圖；實際位置以 DB 與遊戲內設定為準。</text></g>
