<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">寶藏獵人護符升級流程圖</title>
<desc id="desc">玩家透過尋寶累積次數與碎片，在奇岩村找寶藏獵人護符升級師製作六階護符。</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#170d14"/><stop offset=".55" stop-color="#2b1718"/><stop offset="1" stop-color="#07070b"/></linearGradient>
<linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#ffe7a2"/><stop offset=".5" stop-color="#d79a33"/><stop offset="1" stop-color="#8a5516"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="680" fill="url(#bg)"/>
<circle cx="1020" cy="118" r="220" fill="#b34a20" opacity=".16"/>
<circle cx="176" cy="560" r="260" fill="#d6a23d" opacity=".13"/>
<path d="M120 132h960v416H120z" rx="34" fill="#0f0d12" opacity=".84" stroke="#d8a649" stroke-opacity=".45" stroke-width="3"/>
<text x="600" y="85" text-anchor="middle" fill="#ffe3a0" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="44" font-weight="900">寶藏獵人護符升級</text>
<text x="600" y="128" text-anchor="middle" fill="#cdbb98" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="22">尋寶次數 + 碎片 + 前階護符，在奇岩升到 1-6 階</text>
<g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-weight="800">
<g transform="translate(180 205)">
<circle cx="0" cy="0" r="62" fill="url(#gold)" filter="url(#glow)"/>
<text x="0" y="11" text-anchor="middle" fill="#21140a" font-size="34">1</text>
<text x="0" y="105" text-anchor="middle" fill="#ffe3a0" font-size="25">參加尋寶</text>
<text x="0" y="140" text-anchor="middle" fill="#c8b894" font-size="18">累積總次數與品質次數</text>
</g>
<g transform="translate(440 205)">
<circle cx="0" cy="0" r="62" fill="url(#gold)" filter="url(#glow)"/>
<text x="0" y="11" text-anchor="middle" fill="#21140a" font-size="34">2</text>
<text x="0" y="105" text-anchor="middle" fill="#ffe3a0" font-size="25">收集碎片</text>
<text x="0" y="140" text-anchor="middle" fill="#c8b894" font-size="18">普通 / 精良 / 稀有 / 傳說</text>
</g>
<g transform="translate(700 205)">
<circle cx="0" cy="0" r="62" fill="url(#gold)" filter="url(#glow)"/>
<text x="0" y="11" text-anchor="middle" fill="#21140a" font-size="34">3</text>
<text x="0" y="105" text-anchor="middle" fill="#ffe3a0" font-size="25">找奇岩 NPC</text>
<text x="0" y="140" text-anchor="middle" fill="#c8b894" font-size="18">寶藏獵人護符升級師</text>
</g>
<g transform="translate(960 205)">
<circle cx="0" cy="0" r="62" fill="url(#gold)" filter="url(#glow)"/>
<text x="0" y="11" text-anchor="middle" fill="#21140a" font-size="34">4</text>
<text x="0" y="105" text-anchor="middle" fill="#ffe3a0" font-size="25">製作護符</text>
<text x="0" y="140" text-anchor="middle" fill="#c8b894" font-size="18">最高階優先生效</text>
</g>
</g>
<path d="M263 205h94M523 205h94M783 205h94" stroke="#ffd271" stroke-width="8" stroke-linecap="round" opacity=".75"/>
<g transform="translate(205 455)" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
<rect x="0" y="0" width="790" height="86" rx="18" fill="#17131a" stroke="#d8a649" stroke-opacity=".35"/>
<text x="34" y="36" fill="#ffe3a0" font-size="24" font-weight="900">背包效果</text>
<text x="34" y="66" fill="#cdbb98" font-size="20">930610-930615：HP +10/+20/+30/+40/+50/+60，MP +5/+10/+15/+20/+25/+30</text>
</g>
</svg>
