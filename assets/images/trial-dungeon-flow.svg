<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">試煉副本三關流程</title>
  <desc id="desc">隊長帶領持票隊伍進場，每種難度共用三十分鐘；每關一隻指定怪掉一把共用鑰匙，全隊集結到傳送者旁前進。</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#211d16"/><stop offset="1" stop-color="#101012"/></linearGradient>
    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#f1d58f"/><stop offset="1" stop-color="#9b7435"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#c8a45b"/></marker>
  </defs>
  <rect width="1200" height="540" rx="8" fill="url(#bg)"/>
  <path d="M96 270h1008" stroke="#806638" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow)" opacity=".8"/>
  <g font-family="Microsoft JhengHei, sans-serif" text-anchor="middle">
    <g transform="translate(48 72)">
      <rect width="250" height="390" rx="6" fill="#171719" stroke="#806638" stroke-width="2"/>
      <circle cx="125" cy="82" r="42" fill="#302719" stroke="url(#gold)" stroke-width="3"/>
      <path d="M105 84h38m-8-12 12 12-12 12m-22-23v23" fill="none" stroke="#f1d58f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="125" y="160" fill="#f1d58f" font-size="24" font-weight="700">入場準備</text>
      <text x="125" y="207" fill="#eee8dc" font-size="18">隊長帶隊・每人持票</text>
      <text x="125" y="240" fill="#c9c0ae" font-size="16">入口 NPC 80032</text>
      <text x="125" y="284" fill="#c9c0ae" font-size="16">全隊在 NPC 5 格內</text>
      <text x="125" y="322" fill="#d8bd7c" font-size="16">2～8 人・52／60／80 級</text>
    </g>
    <g transform="translate(338 72)">
      <rect width="250" height="390" rx="6" fill="#171719" stroke="#66817a" stroke-width="2"/>
      <circle cx="125" cy="82" r="42" fill="#172a27" stroke="#6ea99a" stroke-width="3"/>
      <path d="M104 96 125 60l21 36Zm8-2h26" fill="none" stroke="#9ad9c9" stroke-width="4" stroke-linejoin="round"/>
      <text x="125" y="160" fill="#a9d9c9" font-size="24" font-weight="700">第一關</text>
      <text x="125" y="207" fill="#eee8dc" font-size="17">指定怪掉唯一一把鑰匙</text>
      <text x="125" y="248" fill="#c9c0ae" font-size="16">隊員分頭找傳送者</text>
      <text x="125" y="284" fill="#c9c0ae" font-size="15">全隊靠近 NPC 80033</text>
      <text x="125" y="330" fill="#d8bd7c" font-size="16">持鑰匙者帶隊前進</text>
    </g>
    <g transform="translate(628 72)">
      <rect width="250" height="390" rx="6" fill="#171719" stroke="#9b763b" stroke-width="2"/>
      <circle cx="125" cy="82" r="42" fill="#302719" stroke="#d5ab54" stroke-width="3"/>
      <path d="M104 96 125 60l21 36Zm8-2h26" fill="none" stroke="#f1d58f" stroke-width="4" stroke-linejoin="round"/>
      <text x="125" y="160" fill="#f1d58f" font-size="24" font-weight="700">第二關</text>
      <text x="125" y="207" fill="#eee8dc" font-size="17">再取得唯一一把鑰匙</text>
      <text x="125" y="248" fill="#c9c0ae" font-size="16">全隊回傳送者集合</text>
      <text x="125" y="284" fill="#c9c0ae" font-size="15">持鑰匙者操作 NPC 80033</text>
      <text x="125" y="330" fill="#d8bd7c" font-size="16">全隊進入第三關</text>
    </g>
    <g transform="translate(918 72)">
      <rect width="234" height="390" rx="6" fill="#171719" stroke="#98524a" stroke-width="2"/>
      <circle cx="117" cy="82" r="42" fill="#301b19" stroke="#d27b64" stroke-width="3"/>
      <path d="M94 92h46l-5-30h-36Zm10-30v-8h26v8" fill="none" stroke="#f1b19a" stroke-width="4" stroke-linejoin="round"/>
      <text x="117" y="160" fill="#f0b6a1" font-size="24" font-weight="700">第三關</text>
      <text x="117" y="207" fill="#eee8dc" font-size="18">全隊清除本關怪物</text>
      <text x="117" y="248" fill="#c9c0ae" font-size="15">寶箱怪額外 30% 機率</text>
      <text x="117" y="292" fill="#c9c0ae" font-size="15">完成後隊伍自動回城</text>
      <text x="117" y="342" fill="#d8bd7c" font-size="16">怪物不重生・仍可再挑戰</text>
    </g>
  </g>
  <text x="600" y="510" fill="#aaa18f" font-family="Microsoft JhengHei, sans-serif" font-size="15" text-anchor="middle">普通／困難／地獄各自共用一趟 30 分鐘；隊伍全員離場時暫停，原隊伍可回到目前關卡</text>
</svg>
